name: Valideer skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Valideer de skills
        run: python3 tests/validate_skills.py

      - name: Valideer de OKF-bundels
        run: python3 tests/validate_okf.py

      - name: Controleer dat er geen lege skillmappen zijn
        run: |
          for d in skills/*/; do
            if [ ! -f "${d}SKILL.md" ]; then
              echo "::error::${d} bevat geen SKILL.md"
              exit 1
            fi
          done
